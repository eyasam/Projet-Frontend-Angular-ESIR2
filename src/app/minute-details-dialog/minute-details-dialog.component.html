<div class="minute-details-dialog">
    <h2>Détails de la Minute</h2>
    <div class="detail-row">
      <span class="detail-label">Date :</span>
      <span class="detail-value">{{ data.date | date: 'shortDate' }}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Contenu :</span>
      <span class="detail-value">{{ data.content }}</span>
    </div>
    <h3>Votants</h3>
    <ul *ngIf="data.voters?.length > 0; else noVoters">
      <li *ngFor="let voter of data.voters">
        {{ voter.firstname }} {{ voter.lastname }} ({{ voter.role }})
      </li>
    </ul>
    <ng-template #noVoters>
      <p>Aucun votant pour cette minute.</p>
    </ng-template>
    <button mat-button (click)="closeDialog()">Fermer</button>
  </div>
