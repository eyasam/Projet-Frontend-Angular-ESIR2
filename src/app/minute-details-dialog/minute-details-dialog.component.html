<div class="minute-details-dialog">
  <h2 class="minute-details-title">Détails de la Minute</h2>

  <div class="detail-row">
    <span class="detail-label">Date :</span>
    <span class="detail-value">{{ data?.date | date: 'shortDate' }}</span>
  </div>

  <div class="detail-row">
    <span class="detail-label">Contenu :</span>
    <span class="detail-value">{{ data?.content || 'Non spécifié' }}</span>
  </div>

  <h3 class="voters-title">Votants</h3>
  <ul *ngIf="data?.voters?.length > 0; else noVoters" class="voters-list">
    <li *ngFor="let voter of data.voters" class="voter-item">
      {{ voter.firstname }} {{ voter.lastname }} ({{ voter.role }})
    </li>
  </ul>
  <ng-template #noVoters>
    <p class="no-data-message">Aucun votant pour cette minute.</p>
  </ng-template>

  <div class="dialog-actions">
    <button mat-button (click)="closeDialog()">Fermer</button>
  </div>
</div>
