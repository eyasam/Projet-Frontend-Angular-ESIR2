<div class="user-list-container">
  <h2 class="user-list-title">Liste des utilisateurs</h2>
  
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 user-table">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let user" class="clickable-cell" (click)="viewUser(user.id)">
        {{ user.id }}
      </td>
    </ng-container>

    <ng-container matColumnDef="lastname">
      <th mat-header-cell *matHeaderCellDef> Nom </th>
      <td mat-cell *matCellDef="let user">
        {{ user.lastname }}
      </td>
    </ng-container>

    <ng-container matColumnDef="firstname">
      <th mat-header-cell *matHeaderCellDef> Prénom </th>
      <td mat-cell *matCellDef="let user">
        {{ user.firstname }}
      </td>
    </ng-container>

    <ng-container matColumnDef="age">
      <th mat-header-cell *matHeaderCellDef> Âge </th>
      <td mat-cell *matCellDef="let user">
        {{ user.age }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let user">
        <button mat-button color="primary" [routerLink]="['/users/edit', user.id]" (click)="editUser(user.id)">Modifier</button>
        <button mat-button color="warn" (click)="deleteUser(user.id)">Supprimer</button>
      </td>
    </ng-container>
    
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
