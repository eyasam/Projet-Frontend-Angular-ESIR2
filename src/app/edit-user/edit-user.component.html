<div class="edit-user-container">
    <h2 class="edit-user-title">Modifier les informations de l'utilisateur</h2>
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="firstname">Prénom</label>
        <input
          id="firstname"
          type="text"
          formControlName="firstname"
          placeholder="Entrez le prénom"
          class="form-input"
          [ngClass]="{'invalid': userForm.controls['firstname'].invalid && userForm.controls['firstname'].touched}"
        />
        <div *ngIf="userForm.controls['firstname'].invalid && userForm.controls['firstname'].touched" class="error-message">
          Le prénom est requis.
        </div>
      </div>
  
      <div class="form-field">
        <label for="lastname">Nom</label>
        <input
          id="lastname"
          type="text"
          formControlName="lastname"
          placeholder="Entrez le nom"
          class="form-input"
          [ngClass]="{'invalid': userForm.controls['lastname'].invalid && userForm.controls['lastname'].touched}"
        />
        <div *ngIf="userForm.controls['lastname'].invalid && userForm.controls['lastname'].touched" class="error-message">
          Le nom est requis.
        </div>
      </div>
  
      <div class="form-field">
        <label for="age">Âge</label>
        <input
          id="age"
          type="number"
          formControlName="age"
          placeholder="Entrez l'âge"
          class="form-input"
          [ngClass]="{'invalid': userForm.controls['age'].invalid && userForm.controls['age'].touched}"
        />
        <div *ngIf="userForm.controls['age'].invalid && userForm.controls['age'].touched" class="error-message">
          L'âge est requis et doit être supérieur ou égal à 18.
        </div>
      </div>
  
      <div class="form-actions">
        <button mat-button type="submit" [disabled]="userForm.invalid">Sauvegarder</button>
        <button mat-button mat-dialog-close>Annuler</button>
      </div>
    </form>
  </div>
